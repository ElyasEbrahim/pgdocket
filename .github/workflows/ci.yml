name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  harness-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - run: pip install -r harness/requirements.txt
      - run: python -m pytest -q harness/tests pgdocket/tests
        env:
          PYTHONPATH: harness:.

  oldest-python:
    name: Package compiles on Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"                # the oldest pyproject.toml supports; tests run on 3.12
      - run: python -m compileall -q pgdocket

  compose-config:
    name: Docker Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  ledger-integration:
    name: Ledger on PostgreSQL ${{ matrix.pg }} (non-superuser)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - run: pip install -r harness/requirements.txt
      - run: python -m pytest -q pgdocket/tests/test_ledger_pg.py
        env:
          PYTHONPATH: harness:.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
